# CI for Asset Sweep.
#
# Automatic triggers are intentionally disabled: there is no `src/` yet, so
# lint, type-check, build, and test would fail on every push and leave the
# repository showing a permanently red badge.
#
# When the scanner lands, re-enable automatic runs by replacing the `on:`
# block below with:
#
#   on:
#     push:
#       branches: [main, develop]
#     pull_request:
#       branches: [main, develop]
#
# Until then the workflow can still be run by hand from the Actions tab.
name: CI

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [18.x, 20.x, 22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '20.x'

  publish-dry-run:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish dry run
        run: npm publish --dry-run
